# Publishes a prebuilt package for each version tag (v0.10.0, …) on the public repo, so installing pmx
# downloads one file and builds nothing. INSTALL.md and `pmx update --latest` check it against SHA256SUMS.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'kp-prodgit/productgit'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack
      - run: shasum -a 256 productgit-*.tgz > SHA256SUMS && cat SHA256SUMS
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" productgit-*.tgz SHA256SUMS --title "pmx ${GITHUB_REF_NAME#v}" \
            --notes "Install: follow INSTALL.md (https://github.com/${{ github.repository }}/blob/main/INSTALL.md). Changes: CHANGELOG.md."
