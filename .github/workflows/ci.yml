name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  # The PMX repo's run-record check installs the packaged CLI on Linux; prove that works, on the oldest Node PMX supports.
  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      # A stale lockfile makes `npm install` rewrite it, which then blocks `git pull` on source checkouts.
      - name: lockfile matches package.json
        run: npm install --package-lock-only --ignore-scripts && git diff --exit-code package-lock.json
      - run: npm ci
      - run: npm pack
      - run: npm install -g ./productgit-*.tgz
      - run: pmx --version
      - name: verify-record runs against a PMX repo
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          cd "$RUNNER_TEMP" && git init -q -b main pmx && cd pmx
          echo '{"team":"ci"}' > pmx.config.json && git add -A && git commit -qm init
          pmx verify-record --base main
